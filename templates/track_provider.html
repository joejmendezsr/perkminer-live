<!DOCTYPE html>
<html>
<head>
  <title>Track Service Provider</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
  <style>
    body { margin:0; padding:0; font-family: system-ui, sans-serif; }
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }
    #close-btn {
      border: none;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
    }
    #status {
      font-size: 14px;
    }
    #map {
      position: absolute;
      top: 44px; bottom: 0; left: 0; right: 0;
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <div id="status">
      Status: <span id="status-text">Loading...</span>
      <br>
      <small id="eta-text"></small>
    </div>
    <button id="close-btn" onclick="window.close()">×</button>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
    const interactionId = {{ interaction.id }};
    const statusText = document.getElementById('status-text');
    const etaText = document.getElementById('eta-text');

    const map = L.map('map').setView([{{ interaction.business.latitude or 0 }}, {{ interaction.business.longitude or 0 }}], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(map);

    let providerMarker = null;

    function humanStatus(code) {
      const mapStatus = {
        "on_the_way": "On the way",
        "arrived": "Arrived",
        "contract_initial_paid": "Contract signed - initial fee paid",
        "contract_full_paid": "Contract signed - full fee paid",
        "service_fee_only": "Service call fee only paid",
        "rejected_no_contract": "Rejected quote - no contract or fee",
        "estimate_only": "Estimate only",
      };
      return mapStatus[code] || "Unknown";
    }

    async function fetchStatusAndLocation() {
      try {
        const res = await fetch(`/session/${interactionId}/provider_status_location`);
        if (!res.ok) return;
        const data = await res.json();

        statusText.textContent = humanStatus(data.provider_status) || "No status yet";

        if (data.eta_minutes != null) {
          etaText.textContent = `Estimated arrival: ~${data.eta_minutes} min`;
        } else {
          etaText.textContent = "";
        }

        if (!data.has_location) {
          return;
        }

        const lat = data.lat;
        const lng = data.lng;

        if (!providerMarker) {
          providerMarker = L.marker([lat, lng]).addTo(map);
          map.setView([lat, lng], 14);
        } else {
          providerMarker.setLatLng([lat, lng]);
        }
      } catch (e) {
        console.error(e);
      }
    }

    setInterval(fetchStatusAndLocation, 5000);
    fetchStatusAndLocation();
  </script>
</body>
</html>
